<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panel - Monitor de actividad</title>
  <link rel="stylesheet" href="/css/menu.css" />
</head>
<body>
  <aside class="sidebar" role="navigation" aria-label="Menú lateral">
    <div class="sidebar-header">
      <div class="logo">PEAJES</div>
      <div class="admin-name" id="adminName">Cargando...</div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" id="btnEmular">Emular Tránsito</button>
      <button class="nav-item" id="btnBonificaciones">Asignar Bonificaciones</button>
      <button class="nav-item" id="btnCambiarEstado">Cambiar estado de propietario</button>
    </nav>

    <div class="sidebar-footer">
      <button class="logout" id="btnLogout">Cerrar sesión</button>
    </div>
  </aside>

  <main class="content" role="main">
    <header class="content-header">
      <h1>Monitor de actividad</h1>
      <p class="lead">Panel administrativo</p>
    </header>

    <section id="panel" class="panel">
      <p>Bienvenido al panel. Seleccione una opción del menú.</p>
    </section>
  </main>

  <script src="/js/utilesVista.js"></script>
  <script src="/js/vistaWeb.js"></script>
  <script src="/js/sse.js"></script>
  <script>
    (function(){
      // Handler que la respuesta del servidor debe invocar:
      window.mostrar_nombre = function(nombre) {
        document.getElementById('adminName').textContent = nombre || 'Administrador';
      };

      window.mostrar_menuError = function(texto) {
        const panel = document.getElementById('panel');
        panel.innerHTML = '<p class="msg error">' + (texto || 'Error cargando menú') + '</p>';
      };

      // Agregar manejo de logout (backend puede devolver "logout" o "logoutAdmin")
      window.mostrar_logout = function(ruta) {
        const destino = ruta || '/login-admin.html';
        document.getElementById('panel').innerHTML = '<p class="msg success">Sesión cerrada. Redirigiendo...</p>';
        setTimeout(() => window.location.href = destino, 350);
      };
      // alias por si el controlador devuelve 'logoutAdmin'
      window.mostrar_logoutAdmin = window.mostrar_logout;

      // Al cargar la vista solicitamos el nombre al endpoint /menu/cargarMenu
      document.addEventListener('DOMContentLoaded', function(){
        // usa la función submit definida en vistaWeb.js
        if (typeof submit === 'function') {
          submit('/menu/cargarMenu', '', 'POST');
        } else {
          // fallback: fetch directo y ejecutar mostrar_nombre
          fetch('/menu/cargarMenu', { method: 'POST', credentials: 'same-origin' })
            .then(r => r.ok ? r.json() : Promise.reject(r))
            .then(data => {
              if (Array.isArray(data) && data.length>0 && data[0].accion === 'nombre') {
                window.mostrar_nombre(data[0].ruta || data[0].parametro || data[0].mensaje || data[0].ruta);
              } else if (Array.isArray(data) && data.length>0 && data[0].accion === 'menuError') {
                window.mostrar_menuError(data[0].ruta || data[0].parametro || data[0].mensaje);
              } else {
                console.warn('Respuesta inesperada cargarMenu', data);
              }
            }).catch(e => {
              console.error('Error cargando menu', e);
              window.mostrar_menuError('No se pudo contactar al servidor');
            });
        }

        // logout button
        document.getElementById('btnLogout').addEventListener('click', function(){
          if (typeof submit === 'function') {
            submit('/logoutAdmin', '', 'POST');
          } else {
            fetch('/logoutAdmin', { method: 'POST', credentials: 'same-origin' })
              .then(r => r.ok ? r.json() : Promise.reject(r))
              .then(data => {
                if (Array.isArray(data) && data.length>0 && data[0].accion === 'logoutAdmin') {
                  window.location.href = data[0].ruta || '/login-admin.html';
                } else {
                  alert('Error al cerrar sesión');
                }
              }).catch(()=> alert('Error de conexión'));
          }
        });
      });
    })();
  </script>
</body>
</html>
