<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Monitor de actividad</title>
  <link rel="stylesheet" href="/css/menu.css" />
</head>
<body class="dash-body">
  <aside class="dash-sidebar">
    <div class="sidebar-header">
      <div class="logo">ADM</div>
      <div class="sidebar-title">
        <h1>Panel administrador</h1>
        <p id="adminName" class="small">Cargando...</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" id="btnEmular">Emular tránsito</button>
      <button class="nav-item" id="btnBonificaciones">Asignar bonificaciones</button>
      <button class="nav-item" id="btnCambiarEstado">Cambiar estado</button>
    </nav>

    <button class="logout" id="btnLogout">Cerrar sesión</button>
  </aside>

  <main class="dash-main">
    <header class="main-header">
      <h2>Monitor administrativo</h2>
      <p class="muted">Control en tiempo real de la red de peajes</p>
    </header>

    <section id="panel" class="main-panel">
      <p>Seleccione una opción del menú para comenzar.</p>
    </section>
  </main>

  <script src="/js/utilesVista.js"></script>
  <script src="/js/vistaWeb.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      submit('/menu/cargarMenu', '', 'POST');
      const btnEmular = document.getElementById('btnEmular');
      if (btnEmular) {
        btnEmular.addEventListener('click', () => {
          window.location.href = '/emular-transito.html';
        });
      }
    });

    window.mostrar_nombre = function (nombre) {
      document.getElementById('adminName').textContent = nombre || 'Administrador';
    };

    window.mostrar_menuError = function (texto) {
      document.getElementById('panel').innerHTML =
        '<p class="msg error">' + (texto || 'Error cargando menú') + '</p>';
    };

    window.mostrar_logoutAdmin = function (ruta) {
      document.getElementById('panel').innerHTML =
        '<p class="msg success">Sesión cerrada. Redirigiendo...</p>';
      setTimeout(() => (window.location.href = ruta || '/login-admin.html'), 350);
    };
    window.mostrar_logout = window.mostrar_logoutAdmin;

    document.getElementById('btnLogout').addEventListener('click', function () {
      submit('/logoutAdmin', '', 'POST');
    });

    window.procesarErrorSubmit = function (status, texto) {
      console.error('Error monitor:', status, texto);
    };
  </script>
</body>
</html>
