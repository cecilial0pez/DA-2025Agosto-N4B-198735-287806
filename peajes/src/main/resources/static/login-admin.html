<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login Administrador</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <main class="auth-card" role="main" aria-labelledby="title">
    <header class="brand">
      <div class="logo">ADM</div>
      <div>
        <h1 id="title">Ingreso Administrador</h1>
        <p class="small">Acceso al panel de gestión</p>
      </div>
    </header>

    <form id="formAdmin" class="auth-form" novalidate>
      <label for="cedula">Cédula</label>
      <input id="cedula" name="cedula" type="text" autocomplete="username" required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit" class="primary">Entrar</button>
      <a class="ghost" href="/login-prop.html">Soy propietario</a>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="/js/utilesVista.js"></script>
  <script src="/js/vistaWeb.js"></script>
  <script>
    (function(){
      const form = document.getElementById('formAdmin');
      const msg = document.getElementById('msg');

      form.addEventListener('submit', function(e){
        e.preventDefault();
        msg.textContent = '';

        const cedula = form.cedula.value.trim();
        const password = form.password.value.trim();
        if(!cedula || !password){
          msg.className = 'msg error';
          msg.textContent = 'Complete todos los campos.';
          return;
        }

        const params = new URLSearchParams(new FormData(form)).toString();
        submit('/loginAdm', params, 'POST');
      });

      window.mostrar_loginExitoso = function(ruta){
        msg.className = 'msg success';
        msg.textContent = 'Acceso concedido. Redirigiendo...';
        setTimeout(()=>window.location.href = ruta || '/emular-transito.html', 350);
      };

      window.mostrar_loginError = function(texto){
        msg.className = 'msg error';
        msg.textContent = texto || 'Credenciales incorrectas.';
      };

      window.procesarErrorSubmit = function(status, texto){
        msg.className = 'msg error';
        msg.textContent = 'Error de servidor (' + status + ').';
        console.error('loginAdm error:', status, texto);
      };
    })();
  </script>
</body>
</html>
